<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Stats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        function addLeagueInput() {
            const container = document.getElementById('league-inputs');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'league-id';
            input.placeholder = 'Enter Numeric League ID';
            
            // Ensure only numeric input is allowed
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');  // Remove non-digit characters
            });

            container.appendChild(input);
        }

        async function fetchStats() {
            const leagueInputs = document.querySelectorAll('.league-id');
            const leagueIds = Array.from(leagueInputs)
                .map(input => input.value.trim())
                .filter(id => /^\d+$/.test(id));  // Ensure all IDs are valid numbers in string form

            if (leagueIds.length === 0) {
                alert("Please enter at least one valid numeric League ID.");
                return;
            }

            try {
                const response = await fetch('/fetch_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ league_ids: leagueIds })  // Send IDs as strings
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                console.log("Response from backend:", data);  // Debugging log
                displayResults(data);  // Render the results

            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Failed to fetch data. Check console for more info.');
            }
        }

        function displayResults(data) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';  // Clear previous results

            // Create the general "Matchup Records" dropdown
            const matchupDropdown = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Matchup Records';
            matchupDropdown.appendChild(summary);

            // Iterate through each league and display matchups
            for (const [leagueId, matchups] of Object.entries(data)) {
                const leagueDiv = document.createElement('div');
                leagueDiv.className = 'league-section';

                const leagueHeader = document.createElement('h4');
                leagueHeader.textContent = `League ID: ${leagueId}`;
                leagueDiv.appendChild(leagueHeader);

                const leagueMatchupDropdown = createDropdown(`Matchups for League ${leagueId}`, matchups);
                leagueDiv.appendChild(leagueMatchupDropdown);

                matchupDropdown.appendChild(leagueDiv);
            }

            resultsContainer.appendChild(matchupDropdown);
        }

        // Helper function to create a dropdown for matchups
        function createDropdown(title, matchups) {
            const dropdown = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = title;
            dropdown.appendChild(summary);

            const list = document.createElement('ul');

            // Iterate through the matchups and display wins/losses
            for (const [opponent, record] of Object.entries(matchups)) {
                const listItem = document.createElement('li');
                listItem.textContent = `${opponent}: Wins - ${record.wins}, Losses - ${record.losses}`;
                list.appendChild(listItem);
            }

            dropdown.appendChild(list);
            return dropdown;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Fantasy Football Stats</h1>
        <div id="league-inputs">
            <input type="text" class="league-id" placeholder="Enter Numeric League ID"
                oninput="this.value = this.value.replace(/\D/g, '')">
        </div>
        <button onclick="addLeagueInput()">Add Another League</button>
        <button onclick="fetchStats()">Fetch Stats</button>

        <div id="results" class="results-container"></div>
    </div>
</body>
</html>
